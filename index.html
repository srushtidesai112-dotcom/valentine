<!DOCTYPE html>
<html>
<head>
  <title>Be My Valentine 💖</title>
  <style>
    body {
      background:#ffe6eb;
      font-family: Arial;
      text-align:center;
      padding-top:100px;
    }
    button {
      font-size:18px;
      padding:10px 20px;
      border-radius:10px;
      border:none;
      margin:10px;
    }
    #yes {
      background:#ff4d6d;
      color:white;
    }
    #no {
      background:#ccc;
      position:absolute;
    }
  </style>
</head>
<body>

<h2>Will you be my Valentine? 💕</h2>

<button id="yes" onclick="yes()">Yes 💖</button>
<button id="no" onclick="move()">No 😜</button>

<script>
  var music = new Audio("https://www.bensound.com/bensound-music/bensound-love.mp3");
music.loop = true;
  function yes(){
  music.play();
  document.body.innerHTML = `
  <div style="
    text-align:center;
    padding:40px;
    max-width:600px;
    margin:auto;
    color:#333;
  ">
    <h1 style="color:#ff4d6d;">Happy Valentine’s Day Aaroo 💖</h1>
    <img 
  src="IMG_6064.jpeg"
  alt="Us 💖"
  style="
    width:260px;
    max-width:90%;
    border-radius:20px;
    margin:20px auto;
    display:block;
    box-shadow:0 8px 20px rgba(0,0,0,0.2);
  "
>

    <p style="font-size:20px; line-height:1.7; margin-top:20px;">
      I know you would say yes 🥰<br><br>
      You bring so much warmth, calm, and happiness<br>
      in the simplest ways and that means a lot to me.Every time I see 11:11,
      I smile a little more because I think of you 🤍<br><br>
      Today is just a small reminder<br>
      of how special you are to me, always 💕
    </p>

    <p style="font-size:18px; margin-top:30px;">
      With lots of love, ur chompsss🩷✨
    </p>
  </div>
`;
}
function move(){
  var n = document.getElementById("no");
  n.style.left = Math.random()*80 + "vw";
  n.style.top = Math.random()*80 + "vh";
}
</script>

</body>
</html>
